<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        width: 320px;
        color: #171717;
        background: linear-gradient(180deg, #f8f5ef 0%, #efe8db 100%);
      }
      .panel {
        padding: 14px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .subhead {
        margin: 0 0 14px;
        color: #5f5648;
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 12px 0;
      }
      .stack {
        margin: 12px 0;
      }
      .mode-group {
        display: grid;
        gap: 8px;
      }
      .mode-option {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid #d4c7b3;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.72);
      }
      input[type="range"] {
        width: 172px;
      }
      .hint {
        opacity: 0.8;
        font-size: 12px;
        line-height: 1.35;
        color: #5f5648;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 14px;
      }
      button {
        width: 100%;
        padding: 9px 10px;
        border-radius: 10px;
        border: 1px solid #c5b59d;
        background: rgba(255, 255, 255, 0.88);
        cursor: pointer;
      }
      button:hover {
        background: #fff;
      }
      #status {
        min-height: 18px;
        margin-top: 10px;
        font-size: 12px;
        color: #5f5648;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Blackout Poem News</h1>
      <p class="subhead">Turn article text into a live blackout poem overlay.</p>

      <div class="row">
        <div><strong>Enabled</strong></div>
        <input id="enabled" type="checkbox" />
      </div>

      <div class="row">
        <div><strong>Poem words</strong></div>
        <input id="poemWordsTarget" type="range" min="8" max="35" step="1" />
      </div>
      <div class="stack">
        <div id="poemWordsLabel" class="hint"></div>
      </div>

      <div class="stack">
        <div><strong>Selection mode</strong></div>
        <div class="mode-group">
          <label class="mode-option">
            <input id="modeSmart" name="mode" type="radio" />
            <span>Smart local</span>
          </label>
          <label class="mode-option">
            <input id="modeRandom" name="mode" type="radio" />
            <span>Random-ish</span>
          </label>
        </div>
      </div>

      <div class="hint">
        Open a supported news article to apply the blackout. Click the chip on the page to reroll, or use the button below.
      </div>

      <div class="actions">
        <button id="reroll" type="button">Reroll poem</button>
        <button id="refresh" type="button">Refresh tab</button>
      </div>

      <div id="status" aria-live="polite"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
